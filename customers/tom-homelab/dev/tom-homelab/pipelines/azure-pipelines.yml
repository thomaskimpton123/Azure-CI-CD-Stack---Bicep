                az deployment tenant what-if --name wb-tenant-577abfa85bb2 --location australiaeast --template-file tenant.bicep --parameters tenant.bicepparam ${secure_args[@]+"${secure_args[@]}"} --only-show-errors --no-pretty-print --output json > "$preview"
                changes_json="$(jq -c '[(.changes // [])[] | select(.changeType != "NoChange" and .changeType != "Ignore") | {id: .resourceId, type: .changeType}] | sort_by(.id)' "$preview")"
                printf '%s' "$changes_json" | jq -r '.[] | "\(.type)\t\(.id)"'
