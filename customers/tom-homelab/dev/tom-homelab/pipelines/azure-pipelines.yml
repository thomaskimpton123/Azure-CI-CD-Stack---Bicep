                check_value AZ_SUBSCRIPTION_MANAGEMENT AZ_SUBSCRIPTION_MANAGEMENT required
                check_value AZ_SUBSCRIPTION_CONNECTIVITY AZ_SUBSCRIPTION_CONNECTIVITY required
