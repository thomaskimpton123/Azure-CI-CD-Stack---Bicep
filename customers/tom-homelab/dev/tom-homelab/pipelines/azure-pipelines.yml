              AZ_SUBSCRIPTION_MANAGEMENT: "$(AZ_SUBSCRIPTION_MANAGEMENT)"
              AZ_SUBSCRIPTION_CONNECTIVITY: "$(AZ_SUBSCRIPTION_CONNECTIVITY)"
              AZ_SUBSCRIPTION_IDENTITY: "$(AZ_SUBSCRIPTION_IDENTITY)"
              REVIEWED_FINGERPRINT: "$(REVIEWED_FINGERPRINT)"
