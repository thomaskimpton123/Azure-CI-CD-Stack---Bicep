# Generated by Skyforge. Create a pipeline from this file; see README.md beside it.
name: "$(Date:yyyyMMdd)$(Rev:.r)"
trigger: none
pr:
  paths:
    include:
    - customers/tom-homelab/dev/tom-homelab
parameters:
- name: action
  displayName: "Plan only, or plan then apply each root after approval"
  type: string
  default: plan
  values:
  - plan
  - apply
pool:
  vmImage: ubuntu-latest
variables:
- group: bicep-azure-tom-homelab-dev-tom-homelab
- name: BICEP_VERSION
  value: v0.46.1
stages:
- stage: plan_tenant
  displayName: "Plan tenant"
  dependsOn: []
  condition: "and(not(failed()), not(canceled()))"
  jobs:
  - job: plan
    timeoutInMinutes: 120
    steps:
    - checkout: self
      fetchDepth: 1
    - task: "AzureCLI@2"
      name: result
      displayName: "Bicep what-if"
      inputs:
        connectedServiceNameARM: azure-tom-homelab-dev-tom-homelab-tenant-plan
        scriptType: bash
        scriptLocation: inlineScript
        inlineScript: |
          set -euo pipefail
          missing=0
          check_value() {
            case "${!2:-}" in
              ''|'$('*)
                if [ "$3" = required ]; then
                  echo "Set the pipeline variable $1 (see pipelines/README.md)." >&2
                  missing=1
                else
                  unset "$2"
                fi
                ;;
            esac
          }
          check_value AZ_SUBSCRIPTION_APP_DEV AZ_SUBSCRIPTION_APP_DEV required
          check_value AZ_SUBSCRIPTION_MANAGEMENT AZ_SUBSCRIPTION_MANAGEMENT required
          check_value AZ_SUBSCRIPTION_CONNECTIVITY AZ_SUBSCRIPTION_CONNECTIVITY required
          check_value AZ_SUBSCRIPTION_IDENTITY AZ_SUBSCRIPTION_IDENTITY required
          if [ "$missing" -ne 0 ]; then exit 1; fi
          secure_args=()
          preview="$(mktemp)"
          trap 'rm -f "$preview"' EXIT
          az config set bicep.use_binary_from_path=false --only-show-errors
          az bicep install --version "$BICEP_VERSION" --only-show-errors
          az deployment tenant validate --name wb-tenant-577abfa85bb2 --location australiaeast --template-file tenant.bicep --parameters tenant.bicepparam ${secure_args[@]+"${secure_args[@]}"} --only-show-errors --validation-level ProviderNoRbac --output none
          az deployment tenant what-if --name wb-tenant-577abfa85bb2 --location australiaeast --template-file tenant.bicep --parameters tenant.bicepparam ${secure_args[@]+"${secure_args[@]}"} --only-show-errors --validation-level ProviderNoRbac --no-pretty-print --output json > "$preview"
          changes_json="$(jq -c '[(.changes // [])[] | select(.changeType != "NoChange" and .changeType != "Ignore") | {id: .resourceId, type: .changeType}] | sort_by(.id)' "$preview")"
          printf '%s' "$changes_json" | jq -r '.[] | "\(.type)\t\(.id)"'
          fingerprint="$(printf '%s' "$changes_json" | sha256sum | cut -d' ' -f1)"
          if [ "$changes_json" = "[]" ]; then changes=false; else changes=true; fi
          echo "##vso[task.setvariable variable=changes;isOutput=true]$changes"
          echo "##vso[task.setvariable variable=fingerprint;isOutput=true]$fingerprint"
        workingDirectory: "$(Build.SourcesDirectory)/customers/tom-homelab/dev/tom-homelab"
      env:
        AZ_SUBSCRIPTION_APP_DEV: "$(AZ_SUBSCRIPTION_APP_DEV)"
        AZ_SUBSCRIPTION_MANAGEMENT: "$(AZ_SUBSCRIPTION_MANAGEMENT)"
        AZ_SUBSCRIPTION_CONNECTIVITY: "$(AZ_SUBSCRIPTION_CONNECTIVITY)"
        AZ_SUBSCRIPTION_IDENTITY: "$(AZ_SUBSCRIPTION_IDENTITY)"
